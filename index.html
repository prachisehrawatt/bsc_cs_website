<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bachelor of Science in Computer Science — Course Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="shell">
  <nav class="semnav">
    <div class="semnav__brand">B.Sc. Computer Science<span class="college">Acharya Narendra Dev College, Delhi University</span><span>Course Resource Index</span></div>
    <ul class="semnav__list" id="semnav-list"></ul>
  </nav>

  <main>
    <p class="eyebrow">All 8 semesters</p>
    <h1 class="page-title">Course Hub</h1>
    <p class="page-sub">Notes, practical files, PYQs, tutorials, and project work — organized by semester and subject. Pick a semester to start.</p>

    <div class="sem-grid" id="sem-grid"></div>
  <p><a class="back-link" href="admin.html">+ Add a resource</a></p>
</main>
</div>

<script src="js/app.js"></script>
<script>
  initSemNav("");
  const grid = document.getElementById("sem-grid");
  grid.innerHTML = SEMESTERS.map(s => `
    <a class="sem-card" href="${s.slug}/index.html">
      <div class="sem-card__num">Sem ${String(s.n).padStart(2,"0")}</div>
      <div class="sem-card__title">${s.label}</div>
      <div class="sem-card__meta">View subjects →</div>
    </a>
  `).join("");
</script>
</body>
</html>
